suite: migration schema identifier
templates:
  - templates/migrate-job.yaml
tests:
  - it: defaults the migration identity to the OneUptime version
    release:
      name: oneuptime
      namespace: oneuptime
    set:
      image.tag: 12.0.24
      image.overrides.app.tag: 12.0.24-kugelaudio-ui-only-change
      migrate.hook: true
    asserts:
      - equal:
          path: metadata.name
          value: oneuptime-migrate-12-0-24

  - it: changes the job identity only when the declared schema changes
    release:
      name: oneuptime
      namespace: oneuptime
    set:
      image.tag: 12.0.24
      migrate.id: 12.1.0-schema-2
      migrate.hook: true
    asserts:
      - equal:
          path: metadata.name
          value: oneuptime-migrate-12-1-0-schema-2

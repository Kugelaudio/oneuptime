{{- /*
  Config for the node collector. Rendered whenever that DaemonSet runs, which is
  now independent of logs: the filelog receiver and the logs pipeline are the
  only parts gated on pod-log collection. Everything else here is metrics.
*/}}
{{- $wantLogs := eq (include "kubernetes-agent.daemonSetLogsEnabled" .) "true" }}
{{- if and .Values.logs.transformStatements (or (not $wantLogs) .Values.logs.windowsPods.enabled) }}
{{- fail "logs.transformStatements requires DaemonSet-only pod log collection" }}
{{- end }}
{{- if eq (include "kubernetes-agent.daemonSetEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubernetes-agent.fullname" . }}-daemonset
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-agent.labels" . | nindent 4 }}
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      # Collect node, pod, and container resource metrics from kubelet
      kubeletstats:
        collection_interval: {{ .Values.collectionInterval }}
        auth_type: serviceAccount
        endpoint: "https://${env:NODE_IP}:10250"
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container
          {{- if .Values.kubeletstats.volumeMetrics.enabled }}
          - volume
          {{- end }}
        extra_metadata_labels:
          - container.id
        k8s_api_config:
          auth_type: serviceAccount
        {{- if .Values.kubeletstats.utilizationMetrics.enabled }}
        # Saturation metrics — CPU/memory as a percentage of pod
        # limit/request. All disabled by default in the upstream
        # kubeletstats receiver because they require pod limits/requests
        # set; enabling them adds no extra scrape, just derived metric
        # families from data the receiver already collects.
        #
        # The receiver only exposes request/limit utilization at the
        # container and pod level — there is no node-level
        # `k8s.node.*.request_utilization` metric in any receiver
        # version (it's a pod-scheduling ratio, not a kubelet stat).
        # Node request saturation is derived downstream from
        # pod/container requests vs. node allocatable.
        metrics:
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.container.cpu_request_utilization:
            enabled: true
          k8s.container.memory_limit_utilization:
            enabled: true
          k8s.container.memory_request_utilization:
            enabled: true
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
        {{- end }}

      {{- if .Values.cadvisor.enabled }}
      # Scrape this node's kubelet cAdvisor endpoint for container-level
      # metrics that the kubeletstats receiver doesn't translate (CFS
      # throttling, OOM kills). One scrape per node (DaemonSet pod →
      # local kubelet on NODE_IP:10250), no apiserver load.
      #
      # `metric_relabel_configs` drops everything except the configured
      # allowlist at the receiver — cAdvisor exposes hundreds of metrics
      # by default, so without this the per-container cardinality would
      # balloon the collector's memory and the OneUptime metric store.
      prometheus/cadvisor:
        config:
          scrape_configs:
            - job_name: cadvisor
              scrape_interval: {{ .Values.cadvisor.scrapeInterval }}
              scheme: https
              metrics_path: /metrics/cadvisor
              tls_config:
                insecure_skip_verify: true
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              static_configs:
                - targets:
                    - "${env:NODE_IP}:10250"
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "^({{ join "|" .Values.cadvisor.metricsAllowlist }})$"
                  action: keep
      {{- end }}

      {{- if eq (include "kubernetes-agent.hostMetricsEnabled" .) "true" }}
      # OS-level metrics that kubeletstats doesn't surface: disk I/O
      # queue depth, filesystem inode usage, NIC error counters, load
      # average, paging stats. Reads /proc and /sys directly (mounted
      # under /host).
      hostmetrics:
        collection_interval: {{ .Values.hostMetrics.collectionInterval }}
        root_path: /host
        scrapers:
          cpu:
          load:
          memory:
          disk:
          filesystem:
            include_fs_types:
              fs_types: [ext4, ext3, ext2, xfs, btrfs, zfs]
              match_type: strict
          network:
          paging:
          processes:
      {{- end }}

      {{- if and .Values.auditLogs.enabled $wantLogs }}
      # Kubernetes API server audit log. Self-managed clusters only;
      # managed K8s (EKS / GKE / AKS / DOKS) routes audit logs to the
      # cloud provider's sink instead of writing them to a file.
      filelog/audit:
        include:
          {{- range .Values.auditLogs.paths }}
          - {{ . | quote }}
          {{- end }}
        start_at: end
        include_file_path: true
        operators:
          - type: json_parser
            id: parse-audit-json
            on_error: send
          - type: severity_parser
            parse_from: attributes.level
            mapping:
              warn: warning
              error: ["panic", "error"]
              info: ["request", "requestresponse", "metadata"]
              debug: ["none"]
          - type: add
            field: resource["k8s.cluster.name"]
            value: {{ .Values.clusterName | quote }}
          - type: add
            field: resource["service.name"]
            value: "kubernetes-audit"
      {{- end }}

      {{- if $wantLogs }}
      # Collect pod logs from /var/log/pods.
      #
      # The namespace is encoded in the pod-log directory name
      # (/var/log/pods/<namespace>_<pod>_<uid>/...), so podLogs-scoped
      # namespace rules are applied here as include/exclude path globs.
      # Filtered namespaces are never opened, and the same resolved lists
      # are passed to the API log-tailer when that mode is selected.
      # Exclude always wins over include.
      {{- $podLogInclude := include "kubernetes-agent.namespaceRulePatterns" (dict "root" . "action" "include" "scope" "podLogs") | fromJsonArray }}
      {{- $podLogExclude := include "kubernetes-agent.namespaceRulePatterns" (dict "root" . "action" "exclude" "scope" "podLogs") | fromJsonArray }}
      filelog:
        include:
          {{- if $podLogInclude }}
          {{- range $podLogInclude }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
          {{- else }}
          - /var/log/pods/*/*/*.log
          {{- end }}
        exclude:
          # Always exclude the agent's own logs to avoid a feedback loop.
          - /var/log/pods/{{ .Release.Namespace }}_{{ include "kubernetes-agent.fullname" . }}*/**/*.log
          {{- range $podLogExclude }}
          - /var/log/pods/{{ . }}_*/*/*.log
          {{- end }}
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          # Parse CRI log format
          - type: router
            id: get-format
            routes:
              - output: parser-docker
                expr: 'body matches "^\\{"'
              - output: parser-cri
                expr: 'body matches "^[^ Z]+ "'
              - output: parser-containerd
                expr: 'body matches "^[^ Z]+Z"'
          # Docker JSON log format
          - type: json_parser
            id: parser-docker
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          # CRI log format
          - type: regex_parser
            id: parser-cri
            regex: '^(?P<time>[^ Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%L%j'
          # Containerd log format
          - type: regex_parser
            id: parser-containerd
            regex: '^(?P<time>[^ ^Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          # Extract k8s metadata from file path
          - type: regex_parser
            id: extract-metadata-from-filepath
            regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]+)\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
          - type: move
            from: attributes.log
            to: body
          {{- if and .Values.ebpf.enabled .Values.ebpf.logToTraceCorrelation }}
          # OBI's log enricher zeroes out the original stdout buffer with
          # NULs (then re-emits the enriched line separately), so each
          # intercepted write leaves a placeholder line of NULs/whitespace
          # in the container log file. Drop those — the real enriched
          # line still comes through.
          - type: filter
            id: drop-obi-nul-placeholder
            expr: 'body matches "^[\\x00\\s]*$"'
          # Log ↔ trace correlation. OBI re-emits enriched JSON log lines
          # with `{"trace_id": "...", "span_id": "..."}` fields injected.
          # Pre-filter on the substring so we only run JSON parse on lines
          # that have a chance of containing trace context; the default
          # branch skips straight to the next normal operator. We stash
          # the parsed JSON under `attributes._obi`, lift trace_id /
          # span_id onto the LogRecord, then drop the temp attribute.
          - type: router
            id: ebpf-trace-route
            routes:
              - output: parse-ebpf-trace-json
                expr: 'body matches "\"trace_id\""'
            default: recombine-multiline
          - type: json_parser
            id: parse-ebpf-trace-json
            parse_from: body
            parse_to: attributes._obi
            on_error: send
            output: lift-obi-trace-context
          - type: trace_parser
            id: lift-obi-trace-context
            trace_id:
              parse_from: attributes._obi.trace_id
            span_id:
              parse_from: attributes._obi.span_id
            output: cleanup-obi-attrs
          - type: remove
            id: cleanup-obi-attrs
            field: attributes._obi
            output: recombine-multiline
          {{- end }}
          # Container runtimes write one log entry per newline, so a multi-line
          # event (a Java/Python/Node/.NET stack trace, a pretty-printed JSON
          # blob) arrives as many separate records and renders as many separate
          # lines on the OneUptime Logs page. Recombine continuation lines back
          # into the record they belong to so each exception is a single log.
          # A line starts a new record unless it begins with whitespace or a
          # closing bracket/brace/paren, which covers stack frames and wrapped
          # structured output. source_identifier keys on the per-container log
          # file path so records from different pods/containers never merge.
          # This mirrors the recombine operator the Docker agent already ships.
          - type: recombine
            id: recombine-multiline
            output: move-stream
            combine_field: body
            combine_with: "\n"
            is_first_entry: 'body matches "^[^\\s\\}\\)\\]]"'
            source_identifier: attributes["log.file.path"]
            force_flush_period: 5s
            max_log_size: 1048576
          - type: move
            id: move-stream
            from: attributes.stream
            to: attributes["log.iostream"]
          - type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]
          - type: move
            from: attributes.pod_name
            to: resource["k8s.pod.name"]
          - type: move
            from: attributes.container_name
            to: resource["k8s.container.name"]
          - type: move
            from: attributes.uid
            to: resource["k8s.pod.uid"]
          # Container runtimes (Docker, containerd, CRI-O) do not record a
          # severity on the log line, so OTel LogRecords arrive at OneUptime
          # with severity_number=0 and render as "Unspecified" on the Logs
          # page. Derive a best-effort severity: route to body-based extraction
          # when the body carries a recognizable severity keyword, else fall
          # back to stdout/stderr mapping. Using a router rather than
          # regex_parser's on_error keeps this compatible with OTel Collector
          # v0.96.0.
          #
          # A level keyword is only believed when it sits where a LEVEL sits, not
          # merely because the word turns up somewhere in the line. Two shapes
          # count, and the pattern is those two, in this order:
          #
          #   1. LINE PREAMBLE. The keyword is on the first line of the record and
          #      everything before it is preamble: punctuation, digits, and word
          #      tokens that end on a structural delimiter (. ] = - : / | ) }).
          #      That is "[ERROR] ...", Monolog's "app.INFO: ...", "2026-08-31
          #      07:25:04 INFO ...", Python's "... - myapp - INFO - ..." and
          #      logfmt's leading "level=error ...". Prose is not: "Connection
          #      error, retrying" stops the preamble dead at "Connection ",
          #      because a bare word followed by a space is not a preamble token.
          #      The repetition is LAZY, so the first keyword in preamble
          #      position wins rather than the last.
          #   2. LEVEL FIELD. The keyword is the value of a level-ish key anywhere
          #      in the line -- level / lvl / severity / severity_text / levelname
          #      / log.level / log_level -- quoted or not, separated by ":" or
          #      "=". That is zap and logrus JSON ({"level":"info"}) and logfmt
          #      whose level is not the first field (ts=... level=error msg=...).
          #
          # The preamble branch is anchored, so when it matches it is the leftmost
          # match and beats a level field further along the same line. Both
          # branches take end-of-body as a trailing delimiter, so Docker (whose
          # json-file driver keeps the newline in the `log` field) and Podman
          # (whose CRI format does not) read the same line the same way.
          #
          # A line matching none of the level shapes below takes the content
          # fallback at the end of this block. Every keyword the parsers capture
          # MUST also resolve in `severity-parser`: stanza's built-in preset
          # knows nothing of notice/crit/critical/panic/alert/emerg/emergency or
          # of the single letters and Postgres names added here, and an unmapped
          # keyword leaves the record Unspecified.
          #
          # Further level shapes, each its own route because the level sits in a
          # place the preamble branch cannot reach without also reading prose:
          #
          #   LETTER. A one-letter level in a fixed position: klog/glog
          #     (`W1029 22:00:00.123456 1 file.go:12] ...`, also behind torch's
          #     `[rank0]:`), NeMo (`[NeMo W 2026-10-29 22:00:00 modelPT:42] ...`)
          #     and onnxruntime (`<ESC>[0;93m2026-10-29 22:00:00.1 [W:onnxruntime:`).
          #     D/V debug and verbose, I info, W warn, E and C error, F fatal.
          #   PYWARN. The Python `warnings` module's own header,
          #     `<file>.py:<line>: <Category>Warning: ...`, which carries the
          #     category instead of a level: WARN.
          #   POSTGRES. `<ts> <TZ> [pid] [user@db ]LEVEL:  ...`. The timezone word
          #     and `[pid]` stop the preamble branch, so Postgres's own WARNING,
          #     ERROR and FATAL were all stored as the stream's guess. LOG is not
          #     read as a level: Postgres files real failures there too (`server
          #     process (PID n) was terminated by signal 9: Killed`, pg_cron's
          #     `cron job N failed`), so a LOG line takes the content fallback.
          #     STATEMENT is printed only beside an error (log_min_error_statement
          #     defaults to error), so it is ERROR. The agent occasionally hands
          #     over two Postgres lines as one record; when a LATER line is
          #     ERROR/FATAL/PANIC that level wins (POSTGRES-JOINED), so a LOG line
          #     in front can never carry an error off the Error page.
          #
          # The preamble branch also crosses the two prefixes that stopped it on
          # real lines: a timezone word followed by whitespace (zap console's
          # `2026-10-29T22:00:00Z<TAB>INFO<TAB>`) and vLLM's process prefix
          # `(EngineCore pid=140) `.
          #
          # FALLBACK. A line with no level in any of these shapes says nothing
          # about its severity, and the stream it was written to does not either:
          # Go's `log`, Python's `logging` and `warnings`, Node's console.warn and
          # every progress bar write ordinary output to stderr. So stderr alone
          # never means ERROR. A level-less stderr line is ERROR only when it
          # names an exception class (`ValueError: ...`, the last line of an
          # uncaught Python traceback), is a traceback frame (`File "x.py", line
          # 3, in f`; vLLM prefixes every frame, so they arrive one per record)
          # or carries fault vocabulary (`Traceback`,
          # `failed`, `refused`, `timed out`, ...), else INFO. The plural
          # `errors` is deliberately absent: progress counters print `0 errors`. stdout keeps INFO, as before: a stdout
          # access log line containing `/error` is not an error.
          - type: router
            id: severity-router
            routes:
              - output: parse-severity-letter
                expr: 'body matches "^(?:\\x1b\\[[0-9;]*m)?(?:\\([A-Za-z0-9_]+ pid=[0-9]+\\) )?(?:\\[rank[0-9]+\\]:|\\[NeMo |[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:.]+ \\[)?([DVIWEFC])(?:[0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]+ +[0-9]+ [^ \\n]+:[0-9]+\\] | [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:.]+ |:onnxruntime:)"'
              - output: add-pywarn-severity
                expr: 'body matches "^(?:\\([A-Za-z0-9_]+ pid=[0-9]+\\) )?(?:<[^>\\n]+>|[^ \\n]*\\.py):[0-9]+: [A-Z][A-Za-z]*Warning: "'
              - output: parse-severity-postgres-joined
                expr: 'body matches "\\n(?:\\[local\\]|[0-9A-Fa-f:.]+)? ?[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)? [A-Z]{2,5} \\[[0-9]+\\] (?:[^ \\n]+@[^ \\n]+ )?(ERROR|FATAL|PANIC):  "'
              - output: parse-severity-postgres
                expr: 'body matches "^(?:\\[local\\]|[0-9A-Fa-f:.]+)? ?[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]+)? [A-Z]{2,5} \\[[0-9]+\\] (?:[^ \\n]+@[^ \\n]+ )?(DEBUG[1-5]|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC|STATEMENT):  "'
              - output: parse-severity-from-body
                expr: 'body matches "(?i)(?:^(?:[^A-Za-z\"\\n]|[A-Za-z][A-Za-z0-9_]*[ \\t]*[.:=,/>|)}\\]-]|(?:Z|UTC|GMT)[ \\t]+|\\([A-Za-z0-9_]+ pid=[0-9]+\\) )*?|(?:^|[\\s,{\\[])\"?(?:log[._]?level|severity_?text|severity|levelname|level|lvl)\"?[ \\t]*[:=][ \\t]*\"?)(TRACE|DEBUG|INFO|NOTICE|WARNING|WARN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|ERR|FATAL|DPANIC|PANIC)(?:$|[\\s\\]:=,)\"}|>])"'
              - output: add-fault-severity
                expr: 'attributes["log.iostream"] == "stderr" and body matches "(?i)(?-i:\\b[A-Z][A-Za-z0-9]*(?:Error|Exception)\\b|File \"[^\"\\n]+\", line [0-9]+, in )|\\b(?:error|exception|traceback|panic|panicked|fatal|fail|fails|failed|failing|failure|abort|aborted|crash|crashed|segfault|segmentation fault|refused|denied|forbidden|unauthorized|timeout|timed out|unreachable|cannot|could not|unable|invalid|corrupt|corrupted|unexpected eof|no such file|not found|out of memory|oom|oomkilled|killed|deadlock|expired|exceeded|unhandled|enoent|eacces|econnrefused|econnreset|etimedout)\\b"'
            default: add-fallback-severity
          - type: regex_parser
            id: parse-severity-letter
            regex: '^(?:\x1b\[[0-9;]*m)?(?:\([A-Za-z0-9_]+ pid=[0-9]+\) )?(?:\[rank[0-9]+\]:|\[NeMo |[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:.]+ \[)?(?P<severity_text>[DVIWEFC])(?:[0-9]{4} [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]+ +[0-9]+ [^ \n]+:[0-9]+\] | [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:.]+ |:onnxruntime:)'
            parse_from: body
            output: severity-parser
          - type: add
            id: add-pywarn-severity
            field: attributes.severity_text
            value: WARN
            output: severity-parser
          - type: regex_parser
            id: parse-severity-postgres-joined
            regex: '\n(?:\[local\]|[0-9A-Fa-f:.]+)? ?[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)? [A-Z]{2,5} \[[0-9]+\] (?:[^ \n]+@[^ \n]+ )?(?P<severity_text>ERROR|FATAL|PANIC):  '
            parse_from: body
            output: severity-parser
          - type: regex_parser
            id: parse-severity-postgres
            regex: '^(?:\[local\]|[0-9A-Fa-f:.]+)? ?[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)? [A-Z]{2,5} \[[0-9]+\] (?:[^ \n]+@[^ \n]+ )?(?P<severity_text>DEBUG[1-5]|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC|STATEMENT):  '
            parse_from: body
            output: severity-parser
          - type: regex_parser
            id: parse-severity-from-body
            regex: '(?i)(?:^(?:[^A-Za-z"\n]|[A-Za-z][A-Za-z0-9_]*[ \t]*[.:=,/>|)}\]-]|(?:Z|UTC|GMT)[ \t]+|\([A-Za-z0-9_]+ pid=[0-9]+\) )*?|(?:^|[\s,{\[])"?(?:log[._]?level|severity_?text|severity|levelname|level|lvl)"?[ \t]*[:=][ \t]*"?)(?P<severity_text>TRACE|DEBUG|INFO|NOTICE|WARNING|WARN|EMERGENCY|EMERG|ALERT|CRITICAL|CRIT|ERROR|ERR|FATAL|DPANIC|PANIC)(?:$|[\s\]:=,)"}|>])'
            parse_from: body
            output: severity-parser
          - type: add
            id: add-fault-severity
            field: attributes.severity_text
            value: ERROR
            output: severity-parser
          - type: add
            id: add-fallback-severity
            field: attributes.severity_text
            value: INFO
            output: severity-parser
          - type: severity_parser
            id: severity-parser
            parse_from: attributes.severity_text
            preset: default
            mapping:
              debug:
                - d
                - v
                - debug1
                - debug2
                - debug3
                - debug4
                - debug5
              info:
                - i
                - notice
              warn:
                - w
                - warning
              error:
                - e
                - c
                - dpanic
                - err
                - crit
                - critical
                - statement
              # PSR-3 / syslog put alert and emergency above critical, and
              # neither has a built-in mapping; nginx writes it as [emerg].
              fatal:
                - f
                - panic
                - alert
                - emerg
                - emergency
          - type: remove
            id: remove-severity-attr
            field: attributes.severity_text
      {{- end }}

    processors:
      {{- if .Values.logs.transformStatements }}
      transform/pod_logs:
        # A runtime transform error must retain the original record and emit a
        # collector error, rather than discard the entire batch of pod logs.
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              {{- toYaml .Values.logs.transformStatements | nindent 14 }}
      {{- end }}
      # Enrich with K8s metadata
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.container.name
          labels:
            - tag_name: k8s.pod.label.app
              key: app
              from: pod
            - tag_name: k8s.pod.label.app.kubernetes.io/name
              key: app.kubernetes.io/name
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

      # Stamp with cluster name and default service name. Any keys under
      # .Values.oneuptime.labels are also stamped here as
      # `oneuptime.label.<key>=<value>` resource attributes — the OneUptime
      # ingest pipeline promotes those into project Labels.
      resource:
        attributes:
          - key: k8s.cluster.name
            value: {{ .Values.clusterName | quote }}
            action: upsert
          - key: service.name
            value: "kubernetes-agent-{{ .Values.clusterName }}"
            action: upsert
          # Node identity. Every receiver in this collector reads
          # node-local data — /proc and /sys for hostmetrics, this node's
          # kubelet for kubeletstats and the cAdvisor scrape,
          # /var/log/pods for filelog — so the node this pod is scheduled
          # on owns all of it. kubeletstats stamps `k8s.node.name`
          # itself, but hostmetrics and the Prometheus cAdvisor scrape do
          # not, so without this every node's `system.*` series arrives
          # with no node attribution at all and all of them collapse into
          # one meaningless series. `insert` leaves a receiver-supplied
          # (or k8sattributes-resolved) value alone.
          #
          # It has to be `k8s.node.name`, not `host.name`: OneUptime keys
          # the k8s.node entity on k8s.cluster.name + k8s.node.name, and
          # it suppresses Host identity on any resource that already
          # carries a Kubernetes identity — so a `host.name` here would
          # populate no entity at all.
          - key: k8s.node.name
            value: "${env:NODE_NAME}"
            action: insert
          - key: oneuptime.agent.version
            value: {{ .Chart.AppVersion | quote }}
            action: upsert
          {{- include "kubernetes-agent.oneuptimeLabels" (dict "labels" .Values.oneuptime.labels "action" "upsert") | nindent 10 }}

      # Set service.name from deployment/statefulset/daemonset name when available
      transform:
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil and attributes["k8s.deployment.name"] != ""
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and attributes["k8s.statefulset.name"] != "" and attributes["k8s.deployment.name"] == nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and attributes["k8s.daemonset.name"] != "" and attributes["k8s.deployment.name"] == nil and attributes["k8s.statefulset.name"] == nil
              {{- include "kubernetes-agent.serviceNames" . | nindent 14 }}
        metric_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["k8s.deployment.name"] != nil and attributes["k8s.deployment.name"] != ""
              - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["k8s.statefulset.name"] != nil and attributes["k8s.statefulset.name"] != "" and attributes["k8s.deployment.name"] == nil
              - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["k8s.daemonset.name"] != nil and attributes["k8s.daemonset.name"] != "" and attributes["k8s.deployment.name"] == nil and attributes["k8s.statefulset.name"] == nil
              {{- include "kubernetes-agent.serviceNames" . | nindent 14 }}

      {{- if or (eq (include "kubernetes-agent.logFiltersEnabled" .) "true") (eq (include "kubernetes-agent.metricFiltersEnabled" .) "true") }}
      {{- include "kubernetes-agent.filterProcessor" (dict "root" . "signals" (list "logs" "metrics")) | nindent 6 }}
      {{- end }}

      batch:
        send_batch_size: 1024
        timeout: 10s

      # Memory ceiling for the collector. limit_mib / spike_limit_mib are
      # derived from the container memory limit
      # (.Values.logs.resources.limits.memory, wired into the DaemonSet at
      # templates/daemonset.yaml) so the limiter always trips *below* the
      # cgroup limit — otherwise the kernel OOMKills the pod before the
      # limiter can shed load. limit_mib ≈ 80% of the container limit,
      # spike_limit_mib ≈ 20% of limit_mib (OTel guidance). See the
      # `kubernetes-agent.memoryLimiter` helper.
      memory_limiter:
        {{- include "kubernetes-agent.memoryLimiter" (.Values.logs.resources.limits.memory | default "512Mi") | nindent 8 }}

    exporters:
      otlphttp:
        endpoint: "{{ .Values.oneuptime.url }}/otlp"
        headers:
          x-oneuptime-token: "${env:ONEUPTIME_API_KEY}"
        # Bound how much un-exported telemetry can buffer in RAM when the
        # OneUptime backend is slow or unreachable. Without an explicit queue
        # and retry window the exporter falls back to the OTel defaults
        # (queue_size 1000, retry for up to 300s), which on this
        # memory-constrained DaemonSet pod can buffer past the container limit
        # and get the pod OOMKilled before memory_limiter / GOMEMLIMIT can
        # react (the original symptom: crashes on backend 502 /
        # context-deadline-exceeded). A small queue plus a short retry window
        # sheds (drops) excess logs during an outage instead of crashing; the
        # pod keeps running and resumes exporting when the backend recovers.
        # For zero-loss buffering across longer outages, swap this for a
        # file_storage-backed persistent queue (needs the file_storage
        # extension and a writable volume).
        sending_queue:
          enabled: true
          num_consumers: 5
          queue_size: 256
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 120s

    service:
      extensions:
        - health_check
      pipelines:
        metrics:
          receivers:
            - kubeletstats
            {{- if .Values.cadvisor.enabled }}
            - prometheus/cadvisor
            {{- end }}
            {{- if eq (include "kubernetes-agent.hostMetricsEnabled" .) "true" }}
            - hostmetrics
            {{- end }}
          processors:
            - memory_limiter
            - k8sattributes
            {{- if eq (include "kubernetes-agent.metricFiltersEnabled" .) "true" }}
            # After k8sattributes so namespace conditions can match; before
            # batch so dropped series never leave the node.
            - filter/telemetry
            {{- end }}
            - resource
            - transform
            - batch
          exporters:
            - otlphttp
        {{- if $wantLogs }}
        logs:
          receivers:
            - filelog
            {{- if .Values.auditLogs.enabled }}
            - filelog/audit
            {{- end }}
          processors:
            - memory_limiter
            - k8sattributes
            {{- if .Values.logs.transformStatements }}
            - transform/pod_logs
            {{- end }}
            {{- if eq (include "kubernetes-agent.logFiltersEnabled" .) "true" }}
            # Severity is set by the receiver's operator chain above, so the
            # filter sees a real severity_number by the time it runs here.
            - filter/telemetry
            {{- end }}
            - resource
            - transform
            - batch
          exporters:
            - otlphttp
        {{- end }}
{{- end }}
